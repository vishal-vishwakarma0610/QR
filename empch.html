<!DOCTYPE html>
<html>
<head>
  <title>Employee Check-In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h2>Checking Your Location...</h2>
  <div id="status">Getting your location...</div>

  <script>
    const centerLat = 26.620702; // Replace with your actual latitude
    const centerLon = 81.280729; // Replace with your actual longitude

    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    navigator.geolocation.getCurrentPosition(function(position) {
      const userLat = position.coords.latitude;
      const userLon = position.coords.longitude;
      const distance = getDistanceFromLatLonInMeters(centerLat, centerLon, userLat, userLon);

      if (distance <= 30) {
        document.getElementById("status").innerText = "✅ You are within 30 meters. Marked present.";
      } else {
        document.getElementById("status").innerText = "❌ You are too far away. Please move closer.";
      }
    }, function() {
      document.getElementById("status").innerText = "⚠️ Unable to get your location.";
    });
  </script>
</body>
</html>
